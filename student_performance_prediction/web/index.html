<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Performance Prediction</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">
        <section class="app-panel">
            <h1>Student Performance Prediction</h1>
            <p class="subtitle">Enter student details and get a simple performance prediction.</p>

            <form id="predictionForm">
                <div class="form-group">
                    <label for="attendance">Attendance Percentage</label>
                    <input type="number" id="attendance" min="0" max="100" placeholder="Example: 85" required>
                </div>

                <div class="form-group">
                    <label for="assignment">Assignment Score</label>
                    <input type="number" id="assignment" min="0" max="100" placeholder="Example: 78" required>
                </div>

                <div class="form-group">
                    <label for="midterm">Mid-Term Marks</label>
                    <input type="number" id="midterm" min="0" max="100" placeholder="Example: 74" required>
                </div>

                <div class="form-group">
                    <label for="previousGrade">Previous Semester Grade</label>
                    <select id="previousGrade" required>
                        <option value="">Select grade</option>
                        <option value="A">A</option>
                        <option value="B">B</option>
                        <option value="C">C</option>
                        <option value="D">D</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="studyHours">Study Hours Per Day</label>
                    <input type="number" id="studyHours" min="0" max="12" step="0.5" placeholder="Example: 3" required>
                </div>

                <div class="form-group">
                    <label for="participation">Participation in Activities</label>
                    <select id="participation" required>
                        <option value="">Select option</option>
                        <option value="Yes">Yes</option>
                        <option value="No">No</option>
                    </select>
                </div>

                <button type="submit">Predict Performance</button>
                <button type="button" id="clearButton" class="secondary-button">Clear</button>
            </form>

            <div id="resultBox" class="result-box hidden">
                <h2>Predicted Performance</h2>
                <p id="predictionText"></p>
                <p id="scoreText" class="score-text"></p>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
